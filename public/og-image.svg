<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ABC Freelancer</title>
  <desc id="desc">Marketplace local para conectar estabelecimentos e freelancers no ABCD Paulista.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1712"/>
      <stop offset="0.52" stop-color="#231b14"/>
      <stop offset="1" stop-color="#342417"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c978"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M0 520 C170 460 330 590 510 528 C690 466 774 374 958 426 C1075 459 1150 430 1200 390 L1200 630 L0 630 Z" fill="#3a2b1e" opacity="0.55"/>
  <path d="M760 104 C877 77 981 104 1074 185 C1116 222 1157 239 1200 236 L1200 0 L760 0 Z" fill="#e3b25d" opacity="0.11"/>

  <g transform="translate(82 82)" filter="url(#shadow)">
    <rect width="158" height="158" rx="38" fill="url(#gold)"/>
    <rect x="8" y="8" width="142" height="142" rx="32" fill="none" stroke="#fff8e8" stroke-opacity="0.24" stroke-width="3"/>
    <text x="79" y="96" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="2">ABC</text>
    <circle cx="79" cy="116" r="4" fill="#ffffff" opacity="0.72"/>
  </g>

  <g transform="translate(82 280)">
    <text font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="800" fill="#f2ece3">ABC Freelancer</text>
    <text y="70" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" fill="#e3b25d">Freelancers e estabelecimentos do ABCD Paulista</text>
    <text y="128" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#c8b8a7">Encontre vagas pontuais, diaria e profissionais locais com contato seguro.</text>
  </g>

  <g transform="translate(82 520)">
    <rect width="190" height="44" rx="12" fill="#e3b25d"/>
    <text x="95" y="29" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" text-anchor="middle" fill="#1c1712">abcfreelancer.com.br</text>
  </g>

  <g transform="translate(860 488)" opacity="0.9">
    <circle cx="0" cy="0" r="7" fill="#e3b25d"/>
    <circle cx="42" cy="0" r="7" fill="#c8b8a7"/>
    <circle cx="84" cy="0" r="7" fill="#e3b25d"/>
    <path d="M7 0 H35 M49 0 H77" stroke="#c8b8a7" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
